name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Generate Clean Android Platform Scaffolding
        run: |
          flutter create --platforms=android --org com.example --project-name website_safety_checker /tmp/fresh_app
          rm -rf mobile/android
          cp -r /tmp/fresh_app/android mobile/android

      - name: Configure Manifest Permissions & Link Interceptor
        run: |
          python3 -c '
          path = "mobile/android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              c = f.read()

          if "android.permission.INTERNET" not in c:
              c = c.replace("<application", "<uses-permission android:name=\"android.permission.INTERNET\" />\n    <application")

          c = c.replace("android:launchMode=\"singleTop\"", "android:launchMode=\"singleTask\"")
          c = c.replace("android:label=\"website_safety_checker\"", "android:label=\"Safety Checker\"")

          filters = """
                      <!-- Link Interceptor / Default Browser Handler (clicks on http & https links) -->
                      <intent-filter>
                          <action android:name=\"android.intent.action.VIEW\" />
                          <category android:name=\"android.intent.category.DEFAULT\" />
                          <category android:name=\"android.intent.category.BROWSABLE\" />
                          <data android:scheme=\"http\" />
                          <data android:scheme=\"https\" />
                      </intent-filter>

                      <!-- OS Share Sheet Handler for receive_sharing_intent -->
                      <intent-filter>
                          <action android:name=\"android.intent.action.SEND\" />
                          <category android:name=\"android.intent.category.DEFAULT\" />
                          <data android:mimeType=\"text/plain\" />
                      </intent-filter>
                  </activity>"""

          if "android.intent.action.VIEW" not in c:
              c = c.replace("</activity>", filters)

          with open(path, "w", encoding="utf-8") as f:
              f.write(c)
          '

      - name: Install Dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Build Release APK
        working-directory: ./mobile
        run: flutter build apk --release

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp mobile/build/app/outputs/flutter-apk/app-release.apk build-output/WebsiteSafetyChecker-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebsiteSafetyChecker-APK
          path: build-output/WebsiteSafetyChecker-v1.0.apk
          if-no-files-found: error
          retention-days: 30
