name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Backup Custom AndroidManifest
        run: |
          mkdir -p /tmp/manifest_backup
          cp mobile/android/app/src/main/AndroidManifest.xml /tmp/manifest_backup/AndroidManifest.xml

      - name: Generate Android Project Scaffolding
        working-directory: ./mobile
        run: |
          flutter create --platforms=android --org com.example .

      - name: Restore Custom AndroidManifest
        run: |
          cp /tmp/manifest_backup/AndroidManifest.xml mobile/android/app/src/main/AndroidManifest.xml

      - name: Install Flutter Dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Build Release APK
        working-directory: ./mobile
        run: flutter build apk --release

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp mobile/build/app/outputs/flutter-apk/app-release.apk build-output/WebsiteSafetyChecker-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebsiteSafetyChecker-APK
          path: build-output/WebsiteSafetyChecker-v1.0.apk
          if-no-files-found: error
          retention-days: 30
