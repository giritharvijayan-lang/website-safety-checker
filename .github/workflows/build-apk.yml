name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows 1-click manual trigger from GitHub Actions tab

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        run: flutter doctor -v

      - name: Install Dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Build Release APK
        working-directory: ./mobile
        run: flutter build apk --release

      - name: Rename APK for Easy Download
        run: |
          mkdir -p build-output
          cp mobile/build/app/outputs/flutter-apk/app-release.apk build-output/WebsiteSafetyChecker-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebsiteSafetyChecker-APK
          path: build-output/WebsiteSafetyChecker-v1.0.apk
          if-no-files-found: error
          retention-days: 30
