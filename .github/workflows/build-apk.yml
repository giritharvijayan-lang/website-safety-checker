name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Scaffolding Clean Android Project
        working-directory: ./mobile
        run: |
          rm -rf android
          flutter create --platforms=android --project-name website_safety_checker --org com.example .

      - name: Inject Custom Intent Filters & Permissions
        run: |
          python3 -c '
          with open("mobile/android/app/src/main/AndroidManifest.xml", "r") as f:
              c = f.read()

          if "android.permission.INTERNET" not in c:
              c = c.replace("<application", "<uses-permission android:name=\"android.permission.INTERNET\" />\n    <application")

          filters = """
                      <!-- Link Interceptor / Default Browser Handler -->
                      <intent-filter>
                          <action android:name=\"android.intent.action.VIEW\" />
                          <category android:name=\"android.intent.category.DEFAULT\" />
                          <category android:name=\"android.intent.category.BROWSABLE\" />
                          <data android:scheme=\"http\" />
                          <data android:scheme=\"https\" />
                      </intent-filter>

                      <!-- Share Sheet Handler -->
                      <intent-filter>
                          <action android:name=\"android.intent.action.SEND\" />
                          <category android:name=\"android.intent.category.DEFAULT\" />
                          <data android:mimeType=\"text/plain\" />
                      </intent-filter>
                  </activity>"""

          c = c.replace("</activity>", filters)

          with open("mobile/android/app/src/main/AndroidManifest.xml", "w") as f:
              f.write(c)
          '

      - name: Install Dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Verify Code Quality (Analyze)
        working-directory: ./mobile
        run: flutter analyze --no-fatal-infos

      - name: Build Release APK
        working-directory: ./mobile
        run: flutter build apk --release --verbose

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp mobile/build/app/outputs/flutter-apk/app-release.apk build-output/WebsiteSafetyChecker-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebsiteSafetyChecker-APK
          path: build-output/WebsiteSafetyChecker-v1.0.apk
          if-no-files-found: error
          retention-days: 30
